<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" role="img" aria-label="Une onde vocale se réorganisant en fiche contact structurée">
  <rect width="640" height="640" fill="#0E1421"/>

  <!-- Onde vocale : l'entrée, en vert lampe -->
  <g fill="#A8E8B0" opacity="0.5">
    <rect x="66"  y="300" width="7" height="40"  rx="3.5"/>
    <rect x="82"  y="284" width="7" height="72"  rx="3.5"/>
    <rect x="98"  y="262" width="7" height="116" rx="3.5"/>
    <rect x="114" y="292" width="7" height="56"  rx="3.5"/>
    <rect x="130" y="248" width="7" height="144" rx="3.5"/>
    <rect x="146" y="276" width="7" height="88"  rx="3.5"/>
    <rect x="162" y="232" width="7" height="176" rx="3.5"/>
    <rect x="178" y="288" width="7" height="64"  rx="3.5"/>
    <rect x="194" y="266" width="7" height="108" rx="3.5"/>
    <rect x="210" y="296" width="7" height="48"  rx="3.5"/>
  </g>

  <!-- Trajectoire : la voix devient donnée -->
  <path d="M232 320 C 268 320, 268 320, 300 320" stroke="#A8E8B0" stroke-width="2"
        stroke-dasharray="5 7" stroke-linecap="round" fill="none" opacity="0.55"/>
  <path d="M292 312 L 302 320 L 292 328" stroke="#F4B266" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Fiche structurée : la sortie, en ambre -->
  <g stroke="#F4B266" fill="none" stroke-linecap="round">
    <rect x="330" y="150" width="248" height="340" rx="10" stroke-width="2.5" opacity="0.9"/>

    <!-- titre et sous-titre -->
    <path d="M360 196 H 494" stroke-width="7"/>
    <path d="M360 222 H 438" stroke-width="5" opacity="0.6"/>

    <!-- filet -->
    <path d="M360 252 H 548" stroke-width="1.5" opacity="0.35"/>

    <!-- champs : libellé + valeur -->
    <g stroke-width="5">
      <path d="M360 288 H 414" opacity="0.5"/>
      <path d="M432 288 H 520" opacity="0.95"/>

      <path d="M360 324 H 414" opacity="0.5"/>
      <path d="M432 324 H 548" opacity="0.95"/>

      <path d="M360 360 H 414" opacity="0.5"/>
      <path d="M432 360 H 496" opacity="0.95"/>

      <path d="M360 396 H 414" opacity="0.5"/>
      <path d="M432 396 H 536" opacity="0.95"/>
    </g>

    <!-- barre de validation -->
    <path d="M360 446 H 548" stroke-width="6" opacity="0.75"/>
  </g>

  <!-- Coche : rien ne part sans validation -->
  <g transform="translate(524 438)">
    <circle r="17" fill="#A8E8B0"/>
    <path d="M-7 1 L -2 6 L 7 -5" stroke="#0E1421" stroke-width="3"
          stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <text x="66" y="556" fill="#E8E1D3" opacity="0.45"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="15" letter-spacing="1.6">NOTE VOCALE</text>
  <text x="574" y="556" fill="#A8E8B0" opacity="0.75" text-anchor="end"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="15" letter-spacing="1.6">FICHE STRUCTUREE</text>
</svg>
